name: android

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Tag pushes arrive via `push` with a tag ref; the jobs below key the
# release path off github.ref_type so one workflow covers both cases.
# (No paths: filter — a tag created on an existing commit can carry an
# empty compare range, which would silently skip a path-filtered run.)
permissions:
  contents: write

jobs:
  build:
    name: Build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore signing keystore (tag builds only)
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/atlas-desk-release.jks

      - name: Build debug APK (push / manual)
        if: github.ref_type != 'tag'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build signed release APK (tags)
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_FILE: keystore/atlas-desk-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          # APP_VERSION is the tag without the leading v.
          export APP_VERSION="${APP_VERSION#v}"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage release APK
        if: github.ref_type == 'tag'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/ATLAS-Desk-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ATLAS Desk ${{ github.ref_name }}
          files: android/out/*.apk
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: "ATLAS Desk ${{ github.ref_name }} — signed release APK built from ${{ github.sha }}. Install on the Tab or Pixel; the app reads the Pi's deckd backend (tailnet/LAN)."
